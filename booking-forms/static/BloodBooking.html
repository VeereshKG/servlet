<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blood Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
    <h3 class="mb-3 text-dark">Blood Booking Form</h3>
    <form action="blood" method="post">
        <div class="mb-3">
            <label class="form-label">Donor Name</label>
            <input type="text" class="form-control" name="donorName" placeholder="Enter name">
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="number" class="form-control" name="contactNumber" placeholder="Enter contact">
        </div>
        <div class="mb-3">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" name="age" placeholder="Enter Age">
        </div>

        <div class="mb-3">
            <label class="form-label" >Blood Group</label>
            <select class="form-select" aria-label="Default select example" name="bloodGroup">
                <option selected>select</option>
                <option value="A+">A+</option>
                <option value="B+">B+</option>
                <option value="O+">O+</option>
                <option value="AB+">AB+</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" name="address" rows="1"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Availability</label><br>
            <input type="radio" name="availability" value="Morning" > Morning
            <input type="radio" name="availability" value="Evening" class="ms-3"> Evening
        </div>
        <button class="btn btn-danger">Submit</button>
    </form>
</div>
</body>
</html>
