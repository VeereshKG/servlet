<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
    <h3 class="text-success-emphasis">E-Commerce Product Form</h3>
    <form action="product" method="post">
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" name="category">
                <option selected>select</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Books">Books</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" class="form-control" name="productName" placeholder="Enter product name">
        </div>
        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="text" class="form-control" name="price" placeholder="Enter price">
        </div>

        <div class="mb-3">
            <label class="form-label">Delivery Address</label>
            <textarea class="form-control" name="description" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Select Payment Mode</label><br>
            <input type="radio" name="payment" value="UPI">UPI <br>
            <input type="radio" name="payment" value="Cash On Delivery">Cash On Delivery <br>
            <input type="radio" name="payment" value="online">Card
        </div>
        <button class="btn btn-success">Submit</button>
    </form>
</div>
</body>
</html>
