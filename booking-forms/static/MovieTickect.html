<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Ticket Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
    <h3 class="mb-3 text-primary">Movie Ticket Booking</h3>
    <form action="movie" method="post">
        <div class="mb-3">
            <label class="form-label">Movie Name</label>
            <input type="text" class="form-control" name="movieName" placeholder="Enter movie name">
        </div>
        <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter your name">
        </div>
        <div class="mb-3">
            <label class="form-label">Select Theatre</label>
            <select class="form-select" name="theatre">
                <option selected>select</option>
                <option value="INOX">INOX</option>
                <option value="PVR">PVR</option>
                <option value="Cinepolis">Cinepolis</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Special Requests</label>
            <textarea class="form-control" name="requests" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Seat Type</label><br>
            <input type="radio" name="seatType" value="Regular"> Regular
            <input type="radio" name="seatType" value="VIP" class="ms-3"> VIP
        </div>
        <button class="btn btn-primary">Book Now</button>
    </form>
</div>
</body>
</html>
