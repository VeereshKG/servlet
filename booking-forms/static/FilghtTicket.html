<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flight Ticket Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
    <h3 class="mb-3 text-info">Flight Ticket Booking</h3>
    <form action="flight" method="post">
        <div class="mb-3">
            <label class="form-label">Passenger Name</label>
            <input type="text" class="form-control" name="passengerName" placeholder="Enter name">
        </div>
        <div class="mb-3">
            <label class="form-label">Source</label>
            <input type="text" class="form-control" name="source" placeholder="Enter Source">
        </div>
        <div class="mb-3">
            <label class="form-label">Destination</label>
            <select class="form-select" name="destination">
                <option selected>select</option>
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Hyderabad">Hyderabad</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Special Instructions</label>
            <textarea class="form-control" name="instructions" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Class Type</label><br>
            <input type="radio" name="classType" value="Economy"> Economy
            <input type="radio" name="classType" value="Business" class="ms-3"> Business
        </div>
        <button class="btn btn-primary">Book Flight</button>
    </form>
</div>
</body>
</html>
