<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
    <h3 class="mb-3 text-danger">Food Order Form</h3>
    <form action="food" method="post">
        <div class="mb-3">
            <label class="form-label">Restaurant Name</label>
            <input type="text" class="form-control" name="restaurant" placeholder="Enter Restaurant Name">
        </div>
        <div class="mb-3">
            <label class="form-label">Select Food Items</label>
            <select class="form-select" name="items">
                <option selected>select</option>
                <option value="Idly">Idly</option>
                <option value="Dosa">Dosa</option>
                <option value="Palvo">Palvo</option>
                <option value="Ice-Cream">Ice-Cream</option>
                <option value="Juice">Juice</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter your Name">
        </div>
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="number" class="form-control" name="phoneNumber" placeholder="Enter phone number">
        </div>

        <div class="mb-3">
            <label class="form-label">Delivery Address</label>
            <textarea class="form-control" name="address" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Payment Mode</label><br>
            <input type="radio" name="paymentMode" value="Cash"> Cash
            <input type="radio" name="paymentMode" value="Online" class="ms-3"> Online
        </div>
        <button class="btn btn-danger">Place Order</button>
    </form>
</div>
</body>
</html>
