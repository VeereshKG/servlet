<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Set Form</title>
</head>
<body>

<h2>Skill Set</h2>
<form action="skill">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>

    <label for="primary skill">Primary Skill:</label>
    <input type="text" id="primary skill" name="primarySkill"><br><br>

    <label for="secondaryskill">Secondary Skill:</label>
    <input type="text" id="secondaryskill" name="secondarySkill"><br><br>

    <label for="db">Database:</label>
    <input type="text" id="db" name="dataBase"><br><br>

    <label for="ide">IDE's:</label>
    <input type="text" id="ide" name="ide"><br><br>

    <label for="ui">UI Technologies:</label>
    <input type="text" id="ui" name="ui"><br><br>

    <label for="exp">Experience (In Years):</label>
    <input type="number" id="exp" name="experience"><br><br>

    <label for="frameworks">Frameworks:</label>
    <input type="text" id="frameworks" name="frameworks"><br><br>

    <label for="otherskills">Other Skills:</label>
    <input type="text" name="otherSkills" id="otherSkills"> <br><br>

    <button type="submit">Submit</button>
</form>

</body>
</html>
