<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Education Details Form</title>
</head>
<body>
<h2>Education Details</h2>
<form action="education">

    <h2>School Info</h2>
    <label for="">Student Name:</label>
    <input type="text" name="studentName"><br><br>

    <label for="">School Name:</label>
    <input type="text" name="schoolName"><br><br>

    <label for="">YearOfPassout:</label>
    <input type="number" name="yearOfPassout"><br><br>

    <label for="">Percentage:</label>
    <input type="text" name="percentage"><br><br>

    <h2>PUC Info</h2>
    <label for="">Student Name:</label>
    <input type="text" name="studentName"><br><br>

    <label for="">College Name:</label>
    <input type="text" name="pucCollegeName"><br><br>

    <label for="">Select Stream:</label>
    <select name="optedStream" id="">
        <option value="">select</option>
        <option value="Science">Science</option>
        <option value="Commerce">Commerce</option>
        <option value="Arts">Arts</option>
    </select>
    <br><br>

    <label for="">YearOfPassout:</label>
    <input type="number" name="pucYearOfPassout"><br><br>

    <label for="">Percentage:</label>
    <input type="text" name="percentageInPuc"><br><br>

    <h2>Degree Info</h2>
    <label for="">Student Name:</label>
    <input type="text" name="studentName"><br><br>

    <label for="">College Name:</label>
    <input type="text" name="degreeCollegeName"><br><br>


    <label for="">Select Course:</label>
    <select name="optedCourse">
        <option value="">select</option>
        <option value="BE/B.Tech">BE/B.Tech</option>
        <option value="B.Sc">B.Sc</option>
        <option value="B.Com">B.Com</option>
        <option value="BBA">BBA</option>
        <option value="BA">BA</option>
        <option value="BFA">BFA</option>
    </select><br><br>

    <label for="">YearOfPassout:</label>
    <input type="number" name="degreeYearOfPassout"><br><br>

    <label for="">Percentage:</label>
    <input type="text" name="percentageInDegree"><br><br>

    <h2>MasterDegree Info</h2>
    <label for="">Student Name:</label>
    <input type="text" name="studentName"><br><br>

    <label for="">College Name:</label>
    <input type="text" name="master's collegeName"><br><br>

    <label for="">Select Course:</label>
    <select name="streamOpted">
        <option value="">select</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Engineering">Engineering</option>
            <option value=" master of Science   ">master of Arts</option>
        <option value="master of Laws">master of Laws</option>
        <option value="master of Architecture">master of Architecture</option>
    </select><br><br>

    <label for="">YearOfPassout:</label>
    <input type="number" name="master'sYearOfPassout"><br><br>

    <label for="">Percentage:</label>
    <input type="text" name="percentageInMasters"><br><br>

    <button type="submit">Submit</button>
</form>
</body>
</html>
