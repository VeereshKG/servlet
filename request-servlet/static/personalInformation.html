<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personl Information Form</title>
</head>
<body>
<h2>Personl Information</h2>
<form action="personal">

    <label for=""> Name:</label>
    <input type="text" name="name"><br><br>

    <label for="">Email: </label>
    <input type="email" name="email"><br><br>

    <label for="">MobileNo: </label>
    <input type="number" name="mobileNo"><br><br>

    <label for="">Age:</label>
    <input type="number" name="age"><br><br>

    <label for="">Address:</label>
    <input type="text" name="address"><br><br>

    <label for="">Select Gender:</label>
    <input type="radio" name="gender" value="male">Male
    <input type="radio" name="gender" value="female">Female
    <br><br>
    <label for="">Date Of Birth:</label>
    <input type="date" name="dateOfBirth"><br><br>

    <label for="">Select Marital Status:</label>
    <input type="radio" name="maritalStatus" value="married">Married
    <input type="radio" name="maritalStatus" value="single">Single <br> <br>

    <button type="submit">Submit</button>
</form>
</body>
</html>
