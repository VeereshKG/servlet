<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patients Registration Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
    <div class="card shadow p-4">

        <h3 class="text-center mb-4">Patient Registration Form</h3>

        <form action="patient" method="post">

            <label>Enter Id:</label>
            <input type="number" name="id" required><br><br>

            <label>consultation doctor Name:</label>
            <input type="text" name="doctorName" required><br><br>

            <label> Disease Name:</label>
            <input type="text" name="disease" required><br><br>

            <label>Patient Name:</label>
            <input type="text" name="name" required><br><br>

            <label>Select Gender:</label>
            <input type="radio" name="gender" value="Male">Male
            <input type="radio" name="gender" value="Female">Female
            <input type="radio" name="gender" value="Others">Others <br><br>

            <label>Blood Group:</label>
            <input type="text" name="bloodGroup" required><br><br>

            <label for="">MobileNo: </label>
            <input type="number" name="mobileNo" required><br><br>

            <label for="">Date Of Birth:</label>
            <input type="date" name="dateOfBirth" required><br><br>

            <label for="">Age:</label>
            <input type="number" name="age" required><br><br>

            <label for="">Select Marital Status:</label>
            <input type="radio" name="maritalStatus" value="married" required>Married
            <input type="radio" name="maritalStatus" value="single" required>Single <br> <br>

            <label for="">Address:</label>
            <input type="text" name="address" required><br><br>

            <button class="btn btn-primary" type="submit">Submit</button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
