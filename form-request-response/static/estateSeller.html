<!DOCTYPE html>
<html>
<head>
    <title>Real Estate Seller Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container mt-5 text-center">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Real Estate Seller Form</h2>
        <form action="seller" method="post">
            <label>Name:</label>
            <input type="text" name="sellerName"><br><br>

            <label>Email:</label>
            <input type="email" name="email"><br><br>

            <label>Phone:</label>
            <input type="text" name="phone"><br><br>

            <label>Property Address:</label>
            <input type="text" name="propertyAddress"><br><br>

            <label>City:</label>
            <input type="text" name="city"><br><br>

            <label>Price:</label>
            <input type="text" name="price"><br><br>

            <label>Property Type:</label>
            <input type="text" name="propertyType"><br><br>

            <label>Bedrooms:</label>
            <input type="text" name="bedrooms"><br><br>

            <label>Furnished :</label>
            <input type="radio" name="yes" required value="Yes">Yes
            <input type="radio" name="yes" required value="No">No <br><br>

            <button class="btn btn-primary" type="submit">Submit</button>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
                    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
                    crossorigin="anonymous"></script>
        </form>
    </div>
</div>
</body>
</html>
