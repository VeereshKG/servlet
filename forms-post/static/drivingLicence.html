<!DOCTYPE html>
<html>
<head>
    <title>Driving License Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container mt-5 text-center">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Driving License Application</h2>
        <form action="license" method="post">
            <label>First Name:</label>
            <input type="text" name="firstName"><br><br>

            <label>Last Name:</label>
            <input type="text" name="lastName"><br><br>

            <label>Date of Birth:</label>
            <input type="date" name="dob"><br><br>

            <label>Select Gender:</label>
            <input type="radio" name="gender" value="Male">Male
            <input type="radio" name="gender" value="Female">Female
            <input type="radio" name="gender" value="Others">Others <br><br>

            <label>Address:</label>
            <input type="text" name="address"><br><br>

            <label>BirthPlace:</label>
            <input type="text" name="place"><br><br>

            <label>City:</label>
            <input type="text" name="city"><br><br>

            <label>State:</label>
            <input type="text" name="state"><br><br>

            <label>PinCode:</label>
            <input type="text" name="code"><br><br>

            <label>Phone:</label>
            <input type="text" name="phone"><br><br>

            <label>Email:</label>
            <input type="email" name="email"><br><br>

            <label>Vehicle Type:</label>
            <input type="text" name="vehicleType"><br><br>

            <label>License Type:</label>
            <input type="text" name="licenseType"><br><br>

            <label>Apply Date:</label>
            <input type="date" name="applyDate"><br><br>

            <label>ID Proof:</label>
            <input type="text" name="idProof"><br><br>

            <label>Blood Group:</label>
            <input type="text" name="bloodGroup"><br><br>

            <button class="btn btn-primary" type="submit">Submit</button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
